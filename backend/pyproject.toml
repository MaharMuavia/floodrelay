[project]
name = "floodrelay"
version = "0.1.0"
description = "Flood-relief coordination agent: extracts, geolocates, de-duplicates, triages and matches help requests, with a hard human gate on dispatch."
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "strands-agents>=1.54.0",
    "strands-agents-tools>=0.8.7",
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "boto3>=1.42.0",
    "botocore>=1.42.0",
    "httpx>=0.28.0",
    "sse-starlette>=3.0.0",
    "apscheduler>=3.11.0",
    "python-multipart>=0.0.20",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
]

[project.optional-dependencies]
# Provider extras. Only the one named by MODEL_PROVIDER needs installing.
ollama = ["ollama>=0.4.0"]
anthropic = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-boto3[dynamodb,s3]>=1.42.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodrelay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "N818",  # GateViolation/ModelUnavailable are the domain names the brief uses
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["floodrelay"]
warn_unreachable = true
# Third-party SDKs without complete stubs.
[[tool.mypy.overrides]]
module = ["strands.*", "strands_tools.*", "apscheduler.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
